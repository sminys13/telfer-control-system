; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino

; Настройки компиляции
build_flags = 
    -Wall
    ; -Werror
    -O2
    -DDEBUG_LEVEL=1
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -DDEBUG_MODE
    ; -DDEBUG_SENSORS
    ; -DDEBUG_MOTORS
    ; -DDEBUG_STORAGE
    ; -DDEBUG_UI
    ; -DDEBUG_STATES
    ; -DDEBUG_UTILS
    ; -DDEBUG_MODBUS
    ; -DNO_DIAGNOSTICS=1
    ; -DNO_STATISTICS=1
    ; -DSIMPLE_UI=1
    
; Настройки загрузки
upload_port = COM6
upload_speed = 9600

; Мониторинг порта
monitor_speed = 115200
monitor_filters = 
    time
    colorize

; Зависимости (библиотеки)
lib_deps = 
    olikraus/U8g2 @ ^2.35.12
    ; Для поддержки кириллицы в U8g2
    ; https://github.com/olikraus/u8g2/wiki/fntgrp
    ; Встроенные шрифты с кириллицей: u8g2_font_6x13_t_cyrillic
    paulstoffregen/Encoder @ ^1.4.2

; Дополнительные пути для библиотек
lib_extra_dirs = 
    lib

; Настройки отладки (если есть отладчик)
; debug_tool = avr-stub
; debug_port = /dev/ttyACM0
; debug_speed = 115200

; Опции для уменьшения размера кода
board_build.f_cpu = 16000000L
board_build.mcu = atmega2560

; Оптимизация для размера
board_build.f_flags = 
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
build_unflags = -Os


; Вывод информации о размере кода
board_build.extra_scripts = 
    pre:scripts/check_size.py
