[platformio]
default_envs = mega_v6_sensor_core_fast

; Step9I keeps only the three actively supported build profiles.
; COM port is intentionally not stored in the repository. PlatformIO can
; auto-detect it, or pass --upload-port COMx / select the port in VS Code.

[env:mega_v6_sensor_core_fast]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_flags =
  -Wall
  -Wextra
  -O2
  -ffunction-sections
  -fdata-sections
  -Wl,--gc-sections
build_src_filter =
  -<*>
  +<main_v6_fast.cpp>
  +<dwin_link.cpp>
  +<fast_laser_sensor.cpp>
  +<sensor_guard_v6.cpp>
  +<he200_service_v6.cpp>
  +<sc16is752.cpp>
  +<settings_v6.cpp>
  +<system_state.cpp>
  +<motor_control_v6.cpp>
  +<vfd_driver_v6.cpp>
  +<modbus.cpp>
  +<motors.cpp>
  +<utils.cpp>
  +<safety_v6.cpp>
  +<program_v6.cpp>
  +<auto_runner_v6.cpp>
extra_scripts =
  pre:scripts/check_size.py

; New isolated Waveshare TTL TO RS485 (B): automatic TX/RX direction,
; Mega pin 6 is not used. HE200 monitoring is physical but READ-ONLY.
[env:mega_v6_he200_waveshare_readonly]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_flags =
  -Wall
  -Wextra
  -O2
  -ffunction-sections
  -fdata-sections
  -Wl,--gc-sections
  -DV6_VFD_RS485_ENABLED=1
  -DV6_VFD_DRY_RUN=0
  -DV6_VFD_WRITE_COMMANDS_ENABLED=0
  -DV6_HE200_COMMISSIONING=1
  -DV6_RS485_AUTO_DIRECTION=1
build_src_filter =
  -<*>
  +<main_v6_fast.cpp>
  +<dwin_link.cpp>
  +<fast_laser_sensor.cpp>
  +<sensor_guard_v6.cpp>
  +<he200_service_v6.cpp>
  +<sc16is752.cpp>
  +<settings_v6.cpp>
  +<system_state.cpp>
  +<motor_control_v6.cpp>
  +<vfd_driver_v6.cpp>
  +<modbus.cpp>
  +<motors.cpp>
  +<utils.cpp>
  +<safety_v6.cpp>
  +<program_v6.cpp>
  +<auto_runner_v6.cpp>
extra_scripts =
  pre:scripts/check_size.py

; Step9I FIELD SERVICE: verified native HE200 0x1000/0x2000/0x3000 map,
; browser-gated writes, physical AUTO/HOME still compile-time BLOCKED.
; Requires verified FIELD NC E-STOP/safety wiring. DWIN motion commands are disabled.
[env:mega_v6_he200_field_service]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_flags =
  -Wall
  -Wextra
  -O2
  -ffunction-sections
  -fdata-sections
  -Wl,--gc-sections
  -DV6_VFD_RS485_ENABLED=1
  -DV6_VFD_DRY_RUN=0
  -DV6_VFD_WRITE_COMMANDS_ENABLED=1
  -DV6_HE200_COMMISSIONING=1
  -DV6_HE200_NATIVE_PROTOCOL=1
  -DV6_HE200_FIELD_SERVICE=1
  -DV6_RS485_AUTO_DIRECTION=1
  -DV6_AUTO_PHYSICAL_ENABLED=0
  -DV6_SAFETY_BENCH_MODE=0
  -DV6_DWIN_MOTION_ENABLED=0
build_src_filter =
  -<*>
  +<main_v6_fast.cpp>
  +<dwin_link.cpp>
  +<fast_laser_sensor.cpp>
  +<sensor_guard_v6.cpp>
  +<he200_service_v6.cpp>
  +<sc16is752.cpp>
  +<settings_v6.cpp>
  +<system_state.cpp>
  +<motor_control_v6.cpp>
  +<vfd_driver_v6.cpp>
  +<modbus.cpp>
  +<motors.cpp>
  +<utils.cpp>
  +<safety_v6.cpp>
  +<program_v6.cpp>
  +<auto_runner_v6.cpp>
extra_scripts =
  pre:scripts/check_size.py
