[platformio]
default_envs = mega_v6_sensor_core_fast

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino

; ---- Build flags ----
build_flags =
    -Wall
    -Wextra
    -O2
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    ; Uncomment for verbose debug
    ; -DDEBUG

monitor_speed = 115200

; ---- Upload ----
; Change COM port to yours
upload_port = COM6
upload_speed = 115200

lib_deps =
    olikraus/U8g2 @ ^2.35.12
    paulstoffregen/Encoder @ ^1.4.2

; Optional script: prints memory usage after build (safe no-op if you remove it)
extra_scripts =
    pre:scripts/check_size.py

[env:mega_v6_bringup]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200

build_src_filter =
  -<*>
  +<main.cpp>
  +<dwin_link.cpp>
  +<laser_sensor.cpp>
  +<sc16is752.cpp>
[env:mega_v6_sensor_core]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
upload_port = COM6
upload_speed = 115200

build_src_filter =
  -<*>
  +<main.cpp>
  +<dwin_link.cpp>
  +<laser_sensor.cpp>
  +<sc16is752.cpp>
  +<settings_v6.cpp>


[env:mega_v6_sensor_core_fast]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
upload_port = COM6
upload_speed = 115200

build_src_filter =
  -<*>
  +<main_v6_fast.cpp>
  +<dwin_link.cpp>
  +<fast_laser_sensor.cpp>
  +<sc16is752.cpp>
  +<settings_v6.cpp>
  +<system_state.cpp>
  +<motor_control_v6.cpp>
  +<vfd_driver_v6.cpp>
  +<modbus.cpp>
  +<motors.cpp>
  +<utils.cpp>
  +<safety_v6.cpp>
  +<program_v6.cpp>
  +<auto_runner_v6.cpp>

; Physical RS485 commissioning mode: Serial1/MAX485 is enabled, but every
; register write/motion command is blocked in VfdDriverV6. Only 0x0204..0x0208
; safe status READ tests are intended in this environment.
[env:mega_v6_he200_readonly]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
upload_port = COM6
upload_speed = 115200

build_flags =
  -DV6_VFD_RS485_ENABLED=1
  -DV6_VFD_DRY_RUN=0
  -DV6_VFD_WRITE_COMMANDS_ENABLED=0
  -DV6_HE200_COMMISSIONING=1

build_src_filter =
  -<*>
  +<main_v6_fast.cpp>
  +<dwin_link.cpp>
  +<fast_laser_sensor.cpp>
  +<sc16is752.cpp>
  +<settings_v6.cpp>
  +<system_state.cpp>
  +<motor_control_v6.cpp>
  +<vfd_driver_v6.cpp>
  +<modbus.cpp>
  +<motors.cpp>
  +<utils.cpp>
  +<safety_v6.cpp>
  +<program_v6.cpp>
  +<auto_runner_v6.cpp>



; Step9E intentionally omits the old NE200 FIELD WRITE environments.
; The supplied HE200 manual confirms monitoring addresses but the exact
; HE200 RUN/STOP write register map is not yet verified. Physical writes
; will be added in a later HE200-specific commissioning step only.
